name: Provision Studio X dev owner
on:
  push:
    branches: [dev/p2-foundation]
    paths: ['ops/provision-owner.trigger']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-x-dev-owner-provision
  cancel-in-progress: false
jobs:
  provision:
    if: github.repository == 'madhupadishala/studio-x-photography' && github.ref == 'refs/heads/dev/p2-foundation' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    env:
      DB_TARGET: dev
      DATABASE_URL: ${{ secrets.DEV_DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DEV_DIRECT_URL }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
    steps:
      - name: Require owner provisioning secrets
        run: |
          failed=0
          for key in DATABASE_URL OWNER_EMAIL OWNER_PASSWORD; do
            if [ -z "${!key}" ]; then
              if [ "$key" = DATABASE_URL ]; then echo "::error::DEV_DIRECT_URL missing"; else echo "::error::$key missing"; fi
              failed=1
            else
              if [ "$key" = DATABASE_URL ]; then echo "DEV_DIRECT_URL present"; else echo "$key present"; fi
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Generate Prisma
        run: npx prisma generate
      - name: Guard dev database
        run: node scripts/db-guard.mjs
      - name: Provision exactly one owner
        run: npm run provision-owner
