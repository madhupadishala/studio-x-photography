name: P2 verification
on:
  pull_request:
  push:
    branches:
      - 'dev/**'
      - 'dev/p2-foundation'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/studio_x_dummy
      DIRECT_URL: postgresql://ci:ci@localhost:5432/studio_x_dummy
      NEXTAUTH_SECRET: ci-dummy-only-not-a-real-secret-32chars
      NEXTAUTH_URL: http://localhost:3000
      DB_TARGET: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Verify environment
        run: npm run verify-env
      - name: Prisma validate
        run: npx prisma validate
      - name: Prisma generate
        run: npx prisma generate
      - name: Check committed migration matches schema
        run: |
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /tmp/studio-initial.sql
          grep -F 'CREATE TABLE "RateLimitBucket"' /tmp/studio-initial.sql
          grep -F 'CREATE TABLE "RateLimitBucket"' prisma/migrations/20261029_rate_limit_bucket/migration.sql
          grep -F 'CREATE TABLE "User"' prisma/migrations/20261029_initial/migration.sql
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Scan client bundle for database secrets and endpoints
        run: |
          if grep -R -E 'DATABASE_URL|DIRECT_URL|NEXTAUTH_SECRET|ep-old-cell-b3jmmab7|ep-rapid-resonance-b30jzpx3' .next/static; then
            echo 'Sensitive variable name or database endpoint leaked into client assets'
            exit 1
          fi
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke
        run: npx playwright test --project=chromium-320 --project=chromium-1440
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  db-integration:
    if: github.repository == 'madhupadishala/studio-x-photography'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: studio-x-dev-db-apply
      cancel-in-progress: false
    env:
      DB_TARGET: dev
      DATABASE_URL: ${{ secrets.DEV_DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DEV_DIRECT_URL }}
      TEST_DATABASE_URL: ${{ secrets.DEV_DIRECT_URL }}
    steps:
      - name: Diagnose secret presence without values
        env:
          DIAG_DEV_DIRECT_URL: ${{ secrets.DEV_DIRECT_URL }}
          DIAG_OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          DIAG_OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: |
          echo "event=$GITHUB_EVENT_NAME repository=$GITHUB_REPOSITORY ref=$GITHUB_REF"
          for key in DEV_DIRECT_URL OWNER_EMAIL OWNER_PASSWORD; do
            var="DIAG_$key"
            if [ -n "${!var}" ]; then echo "$key present"; else echo "::error::$key missing"; fi
          done
      - name: Require dev database and owner secrets
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: |
          failed=0
          for key in TEST_DATABASE_URL OWNER_EMAIL OWNER_PASSWORD; do
            if [ -z "${!key}" ]; then
              if [ "$key" = TEST_DATABASE_URL ]; then echo "::error::DEV_DIRECT_URL missing"; else echo "::error::$key missing"; fi
              failed=1
            else
              if [ "$key" = TEST_DATABASE_URL ]; then echo "DEV_DIRECT_URL present"; else echo "$key present"; fi
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Generate Prisma
        run: npx prisma generate
      - name: Guard dev database
        run: node scripts/db-guard.mjs
      - name: Apply migrations before integration tests
        run: npm run db:deploy
      - name: Database integration tests
        run: npx vitest run tests/integration/db.test.ts
