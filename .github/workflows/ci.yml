name: P2 verification
on:
  pull_request:
  push:
    branches:
      - 'dev/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/studio_x_dummy
      DIRECT_URL: postgresql://ci:ci@localhost:5432/studio_x_dummy
      NEXTAUTH_SECRET: ci-dummy-only-not-a-real-secret-32chars
      NEXTAUTH_URL: http://localhost:3000
      DB_TARGET: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Verify environment
        run: npm run verify-env
      - name: Prisma validate
        run: npx prisma validate
      - name: Prisma generate
        run: npx prisma generate
      - name: Check committed migration matches schema
        run: |
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /tmp/studio-initial.sql
          grep -F 'CREATE TABLE "RateLimitBucket"' /tmp/studio-initial.sql
          grep -F 'CREATE TABLE "RateLimitBucket"' prisma/migrations/20261029_rate_limit_bucket/migration.sql
          grep -F 'CREATE TABLE "User"' prisma/migrations/20261029_initial/migration.sql
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Scan client bundle for database secrets and endpoints
        run: |
          if grep -R -E 'DATABASE_URL|DIRECT_URL|NEXTAUTH_SECRET|ep-old-cell-b3jmmab7|ep-rapid-resonance-b30jzpx3' .next/static; then
            echo 'Sensitive variable name or database endpoint leaked into client assets'
            exit 1
          fi
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke
        run: npx playwright test --project=chromium-320 --project=chromium-1440
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  db-integration:
    if: github.repository == 'madhupadishala/studio-x-photography' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev/p2-foundation') || (github.event_name == 'pull_request' && github.head_ref == 'dev/p2-foundation' && github.event.pull_request.head.repo.full_name == 'madhupadishala/studio-x-photography'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: studio-x-dev-db-apply
      cancel-in-progress: false
    env:
      DB_TARGET: dev
      DATABASE_URL: ${{ secrets.DEV_DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DEV_DIRECT_URL }}
      TEST_DATABASE_URL: ${{ secrets.DEV_DIRECT_URL }}
    steps:
      - name: Check dev database secret
        id: secret
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo 'DEV_DIRECT_URL absent; db-integration skipped'
            echo 'available=false' >> "$GITHUB_OUTPUT"
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.available == 'true'
      - uses: actions/setup-node@v4
        if: steps.secret.outputs.available == 'true'
        with:
          node-version: '20'
      - name: Install
        if: steps.secret.outputs.available == 'true'
        run: npm install --no-audit --no-fund
      - name: Generate Prisma
        if: steps.secret.outputs.available == 'true'
        run: npx prisma generate
      - name: Guard dev database
        if: steps.secret.outputs.available == 'true'
        run: node scripts/db-guard.mjs
      - name: Apply migrations before integration tests
        if: steps.secret.outputs.available == 'true'
        run: npm run db:deploy
      - name: Database integration tests
        if: steps.secret.outputs.available == 'true'
        run: npx vitest run tests/integration/db.test.ts
